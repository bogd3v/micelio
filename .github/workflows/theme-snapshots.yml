name: Theme Snapshots

# Renders the visual baselines of e2e/theme in the Playwright image and uploads them as <artifact-prefix>-snapshots-<theme>; CI never commits them.
# By hand in the core (Actions, input `ref`): the installed themes of that ref, as theme-snapshots-<theme>. Called from a theme's own
# repository, private or public: the themes of `theme-dirs`, built as admission builds them (docs/themes/publishing-a-theme.md, section 6).
# Unzip the artifact into <snapshot-root>/<theme>/, review the images and commit them (docs/theme-testing.md).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to render
        required: true
        default: main
  workflow_call:
    inputs:
      theme-dirs:
        description: Theme folders, or folders of themes, in the caller's repository, one per line
        type: string
        default: .
      themes:
        description: JSON array of the theme ids to render; empty renders every theme found in theme-dirs
        type: string
        default: ''
      core-repository:
        description: The core repository to render against
        type: string
        default: bogd3v/micelio
      core-ref:
        description: Tag, branch or SHA of the core; empty uses its latest release. Pin the same ref as the `uses:` line
        type: string
        default: ''
      snapshot-root:
        description: Folder of the visual baselines in the caller's repository, one subfolder per theme id
        type: string
        default: __screenshots__
      artifact-prefix:
        description: Prefix of the artifacts, <artifact-prefix>-snapshots-<theme id>
        type: string
        default: admission

permissions:
  contents: read

jobs:
  # `inputs.ref` exists only in the run by hand: a called workflow sees its call's inputs, and `github.event_name` is the caller's event
  render:
    name: Render
    uses: ./.github/workflows/theme-admission.yml
    with:
      theme-dirs: ${{ !inputs.ref && inputs.theme-dirs || '' }}
      themes: ${{ inputs.themes || '' }}
      core-repository: ${{ inputs.ref && github.repository || inputs.core-repository }}
      core-ref: ${{ inputs.ref || inputs.core-ref }}
      snapshot-root: ${{ inputs.ref && 'e2e/theme/__screenshots__' || inputs.snapshot-root }}
      artifact-prefix: ${{ inputs.ref && 'theme' || inputs.artifact-prefix }}
      update-snapshots: true
