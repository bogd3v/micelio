name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDER_IMAGE_NAME: ${{ github.repository }}-builder

jobs:
  # The fast checks of section 15 of the standard, from micelio-engineering: npm audit, typecheck, lint (with theme:check), unit tests with
  # coverage, licences, the copy of the standard and REUSE. Formatting is the stylistic rules inside lint, so there is no format:check;
  # there is no build job either, since every browser job below builds. Its status for the ruleset is `check / Check`.
  check:
    uses: bogd3v/micelio-engineering/.github/workflows/check.yml@3693c82f3ed517705c4db27180662d28458f0458 # main
    with:
      test-script: test:coverage
      format: false
      standard: true
      reuse: true
      build: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run integration tests
        run: npm run test:integration

  # The image every browser job runs in: browsers and their system libraries come preinstalled, so no job downloads them (#463).
  # The tag follows the lockfile and is pinned by digest once per run, so a Dependabot bump of @playwright/test moves it
  playwright-image:
    name: Playwright Image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            package-lock.json
            scripts/ci
          sparse-checkout-cone-mode: false
      - name: Resolve the image digest
        id: image
        run: |
          scripts/ci/playwright-image.sh | tee -a "$GITHUB_OUTPUT"

  # The Playwright configs run in parallel jobs, one per group of `npm run test:e2e:<group>`; `npm run test:e2e` runs them all in sequence.
  # The playground suite (183 tests, WebKit the slowest) has one job per engine: each runs its 2 workers on its own runner, and an engine
  # no longer competes with the others for CPU (the comment in playwright.playground.config.ts). Measured at 2 workers: 148 s Chromium,
  # 156 s Firefox and 206 s WebKit of test time, 264 s of wall clock for the three together, on a 32-core machine.
  e2e-tests-group:
    name: E2E ${{ matrix.name }} (Playwright)
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    timeout-minutes: 30
    # Firefox refuses to run as root under the runner's HOME, owned by another user
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: main, group: main, project: '' }
          - { name: site, group: site, project: '' }
          - { name: playground-chromium, group: playground, project: chromium }
          - { name: playground-firefox, group: playground, project: firefox }
          - { name: playground-webkit, group: playground, project: webkit }
          - { name: scene-ui, group: scene-ui, project: '' }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The built server answers at once; nuxt dev compiled each route on demand and timed out
      - name: Build
        run: npm run build
        env:
          # /_theme is registered at build time only with this flag (modules/theme/specimen/setup.ts)
          MICELIO_SPECIMEN: 1
      - name: Run e2e tests
        run: npm run "test:e2e:${E2E_GROUP}" ${E2E_PROJECT:+-- --project="${E2E_PROJECT}"}
        env:
          E2E_BUILD: 1
          E2E_GROUP: ${{ matrix.group }}
          E2E_PROJECT: ${{ matrix.project }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7

  # One stable check name for branch protection and deploy: the name the single job had before the split
  e2e-tests:
    name: E2E Tests (Playwright)
    needs: e2e-tests-group
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every e2e group to pass
        env:
          RESULT: ${{ needs.e2e-tests-group.result }}
        run: |
          echo "e2e groups: ${RESULT}"
          test "${RESULT}" = "success"

  # A static site (ADR 0006) generated against the mock Strapi: no Nuxt client, no runtime API
  e2e-static:
    name: E2E Static Site (Playwright)
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    timeout-minutes: 30
    # Firefox refuses to run as root under the runner's HOME, owned by another user
    env:
      HOME: /root
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate the static site and run the tests
        run: npm run test:static
      # The same site on every engine: the playground's Worker policy, and the view-transition fallback
      - name: Run the playground and view-transition tests on Firefox and WebKit
        run: npm run test:static -- playground.spec.ts view-transition.spec.ts
        env:
          STATIC_SKIP_GENERATE: 1
          STATIC_BROWSERS: chromium,firefox,webkit
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-static
          path: playwright-report/
          retention-days: 7

  # A landing (ADR 0006, section 1) generated against the mock Strapi with a home page and no articles: no blog, navigation from the sections.
  # It builds twice (default theme, then starter) to check that the page does not depend on the theme
  e2e-landing:
    name: E2E Landing (Playwright)
    needs: playwright-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    timeout-minutes: 30
    # Firefox refuses to run as root under the runner's HOME, owned by another user
    env:
      HOME: /root
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate the landing and run the tests
        run: npm run test:landing
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-landing
          path: playwright-report/
          retention-days: 7

  # Installed themes and the site modes with budgets, as the matrix of the performance job;
  # the theme list also feeds theme-quality
  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      themes: ${{ steps.matrix.outputs.themes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: List installed themes and modes
        id: matrix
        run: |
          themes="$(npx jiti scripts/theme-check.ts --list)"
          modes="$(node -p "JSON.stringify(Object.entries(require('./scripts/perf/budgets.json').modes).filter(([, mode]) => mode.ci !== false).map(([id]) => id))")"
          # The heaviest-display-font run (docs/performance.md) is its own entry in dynamic mode only: a static entry has no font run
          echo "matrix=$(node -p "JSON.stringify({ theme: ${themes}, mode: ${modes}, font: ['default', 'heaviest'], exclude: ${modes}.filter((mode) => mode !== 'dynamic').map((mode) => ({ mode, font: 'heaviest' })) })")" >> "$GITHUB_OUTPUT"
          echo "themes=${themes}" >> "$GITHUB_OUTPUT"

  performance:
    name: Performance Budgets (${{ matrix.theme }}, ${{ matrix.mode }}, ${{ matrix.font }} font)
    needs: [matrix, playwright-image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      NUXT_PUBLIC_THEME: ${{ matrix.theme }}
      # Site mode of ADR 0006, read at build time
      NUXT_PUBLIC_SITE_MODE: ${{ matrix.mode }}
      # Chromium only, but the same HOME as every job in the image
      HOME: /root
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # A static entry generates its own site inside the perf script (against the mock Strapi), so only dynamic needs a build
      - name: Build
        if: ${{ matrix.mode == 'dynamic' }}
        run: npm run build
      - name: Check performance budgets
        if: ${{ matrix.font == 'default' }}
        env:
          PERF_THEME: ${{ matrix.theme }}
          PERF_MODE: ${{ matrix.mode }}
        run: npm run perf -- --check --theme "$PERF_THEME" --mode "$PERF_MODE" --out perf-report.json
      # The mock Strapi sets the heaviest curated display font; the font limit is the theme's plus 60 KB (ADR 0005, section 9)
      - name: Check performance budgets with the heaviest display font
        if: ${{ matrix.font == 'heaviest' }}
        env:
          PERF_THEME: ${{ matrix.theme }}
          PERF_MODE: ${{ matrix.mode }}
        run: npm run perf -- --check --theme "$PERF_THEME" --mode "$PERF_MODE" --display-font heaviest --out perf-report-display-font.json
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report-${{ matrix.theme }}-${{ matrix.mode }}-${{ matrix.font }}
          path: |
            perf-report.json
            perf-report-display-font.json
          if-no-files-found: ignore
          retention-days: 14

  # One stable check name for branch protection and deploy: fails when any matrix entry failed, was skipped or cancelled
  performance-gate:
    name: Performance Budgets
    needs: performance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every performance entry to pass
        env:
          RESULT: ${{ needs.performance.result }}
        run: |
          echo "performance matrix: ${RESULT}"
          test "${RESULT}" = "success"

  # Visual regression and axe per installed theme (modes and viewports are projects of playwright.theme.config.ts).
  # Baselines are rendered in the Playwright image: a human commits them from the theme-snapshots-<theme> artifact (docs/theme-testing.md)
  theme-quality:
    name: Theme Quality (${{ matrix.theme }})
    needs: [matrix, playwright-image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.matrix.outputs.themes) }}
    env:
      NUXT_PUBLIC_THEME: ${{ matrix.theme }}
      MICELIO_SPECIMEN: 1
      E2E_BUILD: 1
      HOME: /root
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run visual regression and axe
        run: npm run test:theme
      - name: Upload report and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-report-${{ matrix.theme }}
          path: |
            playwright-report-theme/
            test-results-theme/
          retention-days: 7
      # Never committed by CI: a human reviews the images and commits them (new theme, missing baselines or an intended change)
      - name: Render the baselines as they stand now
        if: failure()
        run: npm run test:theme:update -- e2e/theme/visual.spec.ts
      - name: Upload baselines
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-snapshots-${{ matrix.theme }}
          path: e2e/theme/__screenshots__/${{ matrix.theme }}/
          retention-days: 7

  # One stable check name for branch protection and deploy, like performance-gate
  theme-quality-gate:
    name: Theme Quality
    needs: theme-quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every theme to pass
        env:
          RESULT: ${{ needs.theme-quality.result }}
        run: |
          echo "theme quality matrix: ${RESULT}"
          test "${RESULT}" = "success"

  # Built while the tests run; only the commit tag is pushed, and deploy promotes it to edge (releases add X.Y.Z, X.Y and latest: release.yml)
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Node base image comes from a copy in GHCR, so a Docker Hub rate limit (429) cannot fail the build
      - name: Resolve the Node base image
        id: node-base
        uses: ./.github/actions/node-base

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: ${{ steps.node-base.outputs.build-context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The public provenance records build args: never pass secrets as `build-args`.
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_COMMIT_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Signed attestation that this workflow built this digest; `gh attestation verify` checks it (docs/operate/verify-image.md)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records need artifact-metadata: write, which this job does not get
          create-storage-record: false

  # The builder image (Dockerfile target `static`; docs/operate/static-site.md) for amd64 and arm64: each platform builds
  # natively (no QEMU) and pushes by digest, merge-builder joins the digests under the commit tag
  build-builder:
    name: Build Builder Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the Node base image
        id: node-base
        uses: ./.github/actions/node-base

      - name: Extract builder metadata
        id: meta-builder
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Prepare the platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Build and push builder image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: ${{ steps.node-base.outputs.build-context }}
          target: static
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-builder.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_COMMIT_DATE=${{ steps.meta-builder.outputs.created }}
          cache-from: type=gha,scope=builder-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=builder-${{ env.PLATFORM_PAIR }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builder-digest-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-builder:
    name: Publish Builder Manifest
    runs-on: ubuntu-latest
    needs: build-builder
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: builder-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract builder metadata
        id: meta-builder
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Create the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect the image
        id: inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}
          VERSION: ${{ steps.meta-builder.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          echo "digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')" >> "$GITHUB_OUTPUT"

      # Attached to the merged manifest, the digest an operator pulls, not to the per-platform ones
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BUILDER_IMAGE_NAME }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    needs: [check, integration-tests, e2e-tests, e2e-static, e2e-landing, performance-gate, theme-quality-gate, build-and-push, merge-builder]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A manifest copy: the tested image becomes edge without rebuilding it. latest is moved only by a release.
      - name: Tag the image as edge
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create --tag "${image}:edge" "${image}:${GITHUB_SHA::7}"
          builder="${REGISTRY}/${BUILDER_IMAGE_NAME}"
          docker buildx imagetools create --tag "${builder}:edge" "${builder}:${GITHUB_SHA::7}"

      # Dokploy does not watch GHCR: it only redeploys (pulling :edge) when asked.
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          curl -fsS --retry 3 --retry-all-errors -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${DOKPLOY_APPLICATION_ID}\"}"
