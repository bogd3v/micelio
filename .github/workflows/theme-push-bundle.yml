name: Theme Push Bundle

# Writes what a job of bogd3v/micelio-themes signed to the registry (ADR 0008, decision 4; ADR 0009, amendment of 2026-10-28; #312): `package` pushes the
# attestation of a package to `<theme>:<version>.att`; `index` pushes the new index to `index:v1` and its signature to `index:v1.att`. It signs nothing, and
# it first checks the bundle with the verifier a client uses, against the signer DEFAULT_SIGNER pins, so a bundle made under any other workflow file stops here.
# Called from a bogd3v repository, after the job that signs. The callers to copy: docs/themes/registry-workflows/; how they fit: docs/themes/publishing-a-theme.md.
on:
  workflow_call:
    inputs:
      kind:
        description: '`package` or `index`'
        type: string
        required: true
      theme:
        description: For `package`, the theme id
        type: string
        default: ''
      version:
        description: For `package`, the version
        type: string
        default: ''
      digest:
        description: The sha256 digest the bundle attests (the package, or the index from theme-index-prepare.yml)
        type: string
        required: true
      bundle-artifact:
        description: The artifact that holds bundle.json, the Sigstore bundle
        type: string
        required: true
      index-artifact:
        description: For `index`, the `index-artifact` output of theme-index-prepare.yml
        type: string
        default: ''
      core-ref:
        description: A release tag (vX.Y.Z) or a full commit SHA of bogd3v/micelio whose scripts decide what is written; pin the same ref as the `uses:` line
        type: string
        required: true
      registry:
        description: The registry to write to
        type: string
        default: ghcr.io/bogd3v/micelio-themes

permissions:
  contents: read

jobs:
  push:
    name: Push the ${{ inputs.kind }} bundle
    if: github.repository_owner == 'bogd3v'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ${{ inputs.registry }}
      KIND: ${{ inputs.kind }}
      THEME: ${{ inputs.theme }}
      VERSION: ${{ inputs.version }}
      DIGEST: ${{ inputs.digest }}
    steps:
      - name: Check the inputs
        env:
          CORE_REF: ${{ inputs.core-ref }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "${CORE_REF}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?|[0-9a-f]{40})$ ]] || fail "core-ref must be a release tag (vX.Y.Z) or a full commit SHA"
          [[ "${KIND}" == package || "${KIND}" == index ]] || fail "kind is package or index"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "digest is not a sha256 digest"
          if [ "${KIND}" = package ]; then
            [[ "${THEME}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && ${#THEME} -le 64 ]] || fail "theme is not a theme id"
            [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.0-9A-Za-z]*)$ && ${#VERSION} -le 128 ]] || fail "version is not a semver version"
          fi
      - name: Checkout the core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bogd3v/micelio
          ref: ${{ inputs.core-ref }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install script of any dependency runs in a job that can write the registry
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.bundle-artifact }}
          path: bundle
      - name: Download the index
        if: inputs.kind == 'index'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.index-artifact }}
          path: index
      # The same check a client makes, against the signer the core pins: nothing is pushed for a bundle it refuses
      - name: Verify the bundle
        run: |
          signer=packages
          if [ "${KIND}" = index ]; then signer=index; fi
          MICELIO_THEME_REGISTRY="${REGISTRY}" npm run --silent theme:publish -- verify --kind "${signer}" --digest "${DIGEST}" --bundle bundle/bundle.json
      - name: Setup ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.2.3
      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ "${REGISTRY}" == ghcr.io/bogd3v/* ]] || { echo "::error::The registry must be under ghcr.io/bogd3v: the token goes nowhere else"; exit 1; }
          printf '%s' "${GH_TOKEN}" | oras login "${REGISTRY%%/*}" --username "${ACTOR}" --password-stdin
      - name: Push the package attestation
        if: inputs.kind == 'package'
        run: |
          oras manifest fetch "${REGISTRY}/${THEME}:${VERSION}" | jq -e --arg digest "${DIGEST}" '.layers[0].digest == $digest' > /dev/null
          oras push "${REGISTRY}/${THEME}:${VERSION}.att" "bundle/bundle.json:application/vnd.dev.sigstore.bundle.v0.3+json"
      # The registry has no compare-and-swap: the concurrency group of the caller serializes runs, and `check-base` (tested) catches a write from anywhere else.
      # A client sees an index without a valid signature as no index until the bundle lands, so the bundle is pushed at once and retried. If the index is
      # already there and only its signature is missing (a repeat of this job after the pushes failed), `check-base` says `written` and only the signature is pushed
      - name: Write the index and its signature
        if: inputs.kind == 'index'
        run: |
          [ "$(jq -r .digest index/index.json.info)" = "${DIGEST}" ] || { echo "::error::The index to write is not the one that was signed"; exit 1; }
          state="$(MICELIO_THEME_REGISTRY="${REGISTRY}" npm run --silent theme:publish -- check-base --info index/index.json.info)" || { echo "${state}"; exit 1; }
          # A first index (`base` null) was made because an anonymous read found nothing; GHCR answers the same for a package that is not public, so the
          # login of this job (which can see private packages) confirms there is none before it writes: an index that exists is never replaced by one made from empty.
          # oras-go maps every 404 of a manifest to `<ref>: not found`; any other answer (denied, a certificate, a timeout) stops the job
          if [ "${state}" = "state=write" ] && [ "$(jq -r .base index/index.json.info)" = null ]; then
            if held="$(oras manifest fetch "${REGISTRY}/index:v1" 2>&1)"; then
              echo "::error::An index exists that an anonymous reader cannot see: make the package ${REGISTRY}/index public and run again"; exit 1
            fi
            echo "${held}" | grep -qE ': not found$' || { echo "::error::Could not tell whether ${REGISTRY}/index:v1 exists: ${held}"; exit 1; }
          fi
          if [ "${state}" = "state=write" ]; then
            oras push "${REGISTRY}/index:v1" "index/index.json:application/vnd.micelio.theme.index.v1+json"
          fi
          for attempt in 1 2 3; do
            oras push "${REGISTRY}/index:v1.att" "bundle/bundle.json:application/vnd.dev.sigstore.bundle.v0.3+json" && break
            if [ "${attempt}" = 3 ]; then echo "::error::The index is written but its signature is not: clients refuse it until the job is re-run"; exit 1; fi
            sleep 5
          done
          oras manifest fetch "${REGISTRY}/index:v1" | jq -e --arg digest "${DIGEST}" '.layers[0].digest == $digest' > /dev/null
          echo "### Index \`${DIGEST}\` written" >> "$GITHUB_STEP_SUMMARY"
