name: Static site

# Builds the static or landing site and publishes it to Cloudflare Pages
# (ADR 0006, section 7; guide: docs/static-mode.md). It does nothing unless the
# repository variable STATIC_SITE_ENABLED is "true", so BogDev and forks skip it.

on:
  repository_dispatch:
    types: [micelio-content]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    if: ${{ vars.STATIC_SITE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_PUBLIC_SITE_MODE: ${{ vars.NUXT_PUBLIC_SITE_MODE || 'static' }}
      NUXT_PUBLIC_STRAPI_URL: ${{ vars.NUXT_PUBLIC_STRAPI_URL }}
      NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
      NUXT_MEDIA_URL: ${{ vars.NUXT_MEDIA_URL }}
      NUXT_PUBLIC_THEME: ${{ vars.NUXT_PUBLIC_THEME }}
      NUXT_PUBLIC_NEWSLETTER_FORM_ACTION: ${{ vars.NUXT_PUBLIC_NEWSLETTER_FORM_ACTION }}
    steps:
      - name: Summarize the trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_CHANGES: ${{ toJSON(github.event.client_payload.changes) }}
          PAYLOAD_COUNT: ${{ github.event.client_payload.count }}
        run: |
          {
            echo "### Static site build"
            echo
            echo "- Trigger: \`${EVENT_NAME}\`"
            echo "- Mode: \`${NUXT_PUBLIC_SITE_MODE}\`"
            if [ "$EVENT_NAME" = "repository_dispatch" ]; then
              echo "- Changes: ${PAYLOAD_COUNT:-0} (first 50 listed)"
              echo
              echo '```json'
              echo "$PAYLOAD_CHANGES" | head -c 8000
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the static site
        env:
          # The read-only CMS "build" token, never the frontend token.
          NUXT_STRAPI_API_TOKEN: ${{ secrets.STRAPI_BUILD_TOKEN }}
        run: npm run generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
