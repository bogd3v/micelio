name: Theme Admission

# The gate to publish a theme version (ADR 0008, decision 5; #311): `theme:check` and `theme:pack`, the performance budgets per site mode,
# visual regression and axe, and one admission-report.json per theme (schema: themes/admission-report.schema.json).
# Called from a theme's own repository, private or public, and by the core's deploy.yml for its installed themes; theme-snapshots.yml calls it
# with update-snapshots to render baselines. How to call it: docs/themes/publishing-a-theme.md.
# A data-only theme is installed into one core build shared by every theme of the call; a theme with code gets a build of its own.
# Static and landing generate their site per theme inside `npm run perf`. Every step lives in `npm run theme:admit` of the core ref.
on:
  workflow_call:
    inputs:
      theme-dirs:
        description: Theme folders, or folders of themes, in the caller's repository, one per line. Empty admits the core's own installed themes (deploy.yml)
        type: string
        default: .
      themes:
        description: JSON array of the theme ids to admit; empty admits every theme found in theme-dirs
        type: string
        default: ''
      core-repository:
        description: The core repository to admit against
        type: string
        default: bogd3v/micelio
      core-ref:
        description: Tag, branch or SHA of the core; empty uses its latest release. Pin the same ref as the `uses:` line
        type: string
        default: ''
      modes:
        description: JSON array of site modes to measure; empty measures every mode the core budgets in CI
        type: string
        default: ''
      quality:
        description: Run visual regression and axe
        type: boolean
        default: true
      visual:
        description: Include visual regression in the quality run; the baselines are read from <snapshot-root>/<theme id>/
        type: boolean
        default: true
      snapshot-root:
        description: Folder of the visual baselines in the caller's repository, one subfolder per theme id (outside the theme folder, which the package must not include); the core passes e2e/theme/__screenshots__
        type: string
        default: __screenshots__
      accessibility-root:
        description: Folder of the manual accessibility records in the caller's repository, <accessibility-root>/<theme id>.json (docs/themes/accessibility-checklist.md), outside the theme folder like the baselines
        type: string
        default: accessibility
      display-font:
        description: Also measure dynamic mode with the heaviest curated display font (ADR 0005, section 9)
        type: boolean
        default: true
      fail-on-errors:
        description: Fail the run when a report has errors; false only for a caller that checks the reports itself (the fixture job)
        type: boolean
        default: true
      artifact-prefix:
        description: Prefix of every artifact of this call; two calls in one workflow run need different prefixes
        type: string
        default: admission
      update-snapshots:
        description: Render the visual baselines and upload them as <artifact-prefix>-snapshots-<theme id>, instead of admitting (no performance, no report); theme-snapshots.yml sets it
        type: boolean
        default: false
    outputs:
      ok:
        description: '"true" when every report has no error'
        value: ${{ jobs.report.outputs.ok }}
      static:
        description: '"passed" when `theme:check` and `theme:pack` passed for every theme, "failed" otherwise'
        value: ${{ jobs.report.outputs.static }}
      performance:
        description: '"passed" when every performance run of every theme passed, "failed" otherwise'
        value: ${{ jobs.report.outputs.performance }}
      quality:
        description: '"passed" when visual regression and axe passed for every theme, "skipped" when quality is off, "failed" otherwise'
        value: ${{ jobs.report.outputs.quality }}
      reports:
        description: Name of the artifact that holds <theme id>/admission-report.json and the package of each theme
        value: ${{ jobs.report.outputs.artifact }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan, theme:check and theme:pack
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      shared-builds: ${{ steps.plan.outputs.shared-builds }}
      core-sha: ${{ steps.core.outputs.sha }}
      core-ref: ${{ steps.ref.outputs.ref }}
      external: ${{ steps.ref.outputs.external }}
      theme-dirs: ${{ steps.dirs.outputs.theme-dirs }}
      image: ${{ steps.core.outputs.image }}
    steps:
      - name: Resolve the core ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_REPOSITORY: ${{ inputs.core-repository }}
          CORE_REF: ${{ inputs.core-ref }}
          CALLER: ${{ github.repository }}
        run: |
          ref="${CORE_REF}"
          if [ -z "${ref}" ]; then ref="$(gh release view --repo "${CORE_REPOSITORY}" --json tagName --jq .tagName)"; fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "external=$([ "${CALLER}" = "${CORE_REPOSITORY}" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: Checkout the core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.core-repository }}
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
      - name: Checkout the themes
        if: steps.ref.outputs.external == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: theme-source
          persist-credentials: false
      # The browser jobs run in the Playwright image of the core ref, pinned by digest, like the core's own CI (#698)
      - name: Read the core
        id: core
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node -e "require('./package.json').scripts['theme:admit'] || (console.error('This core ref predates theme admission (#311): pass a core-ref at or after the one in the uses: line'), process.exit(1))"
          scripts/ci/playwright-image.sh | grep '^image=' >> "$GITHUB_OUTPUT"
      # Paths stay inside the caller's checkout: no absolute path, no `..`
      - name: Locate the theme folders
        id: dirs
        env:
          THEME_DIRS: ${{ inputs.theme-dirs }}
          SNAPSHOT_ROOT: ${{ inputs.snapshot-root }}
          ACCESSIBILITY_ROOT: ${{ inputs.accessibility-root }}
          EXTERNAL: ${{ steps.ref.outputs.external }}
        run: |
          prefix=''
          if [ "${EXTERNAL}" = true ]; then prefix=theme-source/; fi
          dirs=()
          while IFS= read -r dir; do
            dir="${dir#./}"; dir="${dir%/}"
            [ -z "${dir}" ] && continue
            if [[ "${dir}" == /* || "/${dir}/" == */../* ]]; then echo "::error::theme-dirs: ${dir} must be a path inside the repository"; exit 1; fi
            dirs+=("${prefix}${dir}")
          done <<< "${THEME_DIRS}"
          if [ "${EXTERNAL}" = true ] && [ "${#dirs[@]}" -eq 0 ]; then echo "::error::theme-dirs is empty: name the theme folders of your repository"; exit 1; fi
          joined="$(IFS=:; echo "${dirs[*]}")"
          for root in snapshot-root:"${SNAPSHOT_ROOT}" accessibility-root:"${ACCESSIBILITY_ROOT}"; do
            if [[ -z "${root#*:}" || "${root#*:}" == /* || "/${root#*:}/" == */../* ]]; then echo "::error::${root%%:*} must be a path inside the repository"; exit 1; fi
          done
          {
            echo "theme-dirs=${joined}"
            echo "snapshot-root=${prefix}${SNAPSHOT_ROOT%/}"
            echo "accessibility-root=${prefix}${ACCESSIBILITY_ROOT%/}"
          } >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Plan the jobs
        id: plan
        env:
          MICELIO_THEME_DIRS: ${{ steps.dirs.outputs.theme-dirs }}
          THEMES: ${{ inputs.themes }}
          MODES: ${{ inputs.modes }}
          QUALITY: ${{ inputs.quality }}
          DISPLAY_FONT: ${{ inputs.display-font }}
          SNAPSHOT_ROOT: ${{ steps.dirs.outputs.snapshot-root }}
          # Only the core admits its own installed themes; an empty theme-dirs from a theme repository is an error below
          INSTALLED: ${{ inputs.theme-dirs == '' && steps.ref.outputs.external == 'false' }}
          PERFORMANCE: ${{ !inputs.update-snapshots }}
        run: |
          npm run --silent theme:admit -- plan --themes "${THEMES}" --modes "${MODES}" --quality "${QUALITY}" --display-font "${DISPLAY_FONT}" --snapshot-root "${SNAPSHOT_ROOT}" \
            --installed "${INSTALLED}" --performance "${PERFORMANCE}" --out admission/plan.json
          echo "plan=$(jq -c . admission/plan.json)" >> "$GITHUB_OUTPUT"
          echo "shared-builds=$(jq -c .sharedBuilds admission/plan.json)" >> "$GITHUB_OUTPUT"
      # Errors here do not stop the run: the report collects them with everything else
      - name: Check and pack each theme
        if: ${{ !inputs.update-snapshots }}
        env:
          MICELIO_THEME_DIRS: ${{ steps.dirs.outputs.theme-dirs }}
          ACCESSIBILITY_ROOT: ${{ steps.dirs.outputs.accessibility-root }}
        run: |
          for id in $(jq -r '.themes[].id' admission/plan.json); do
            echo "::group::${id}"
            npm run --silent theme:admit -- static --theme "${id}" --accessibility "${ACCESSIBILITY_ROOT}/${id}.json" --out "admission/${id}/static.json"
            cp .micelio/packages/"${id}"-*.tgz "admission/${id}/" 2>/dev/null || true
            echo "::endgroup::"
          done
      - name: Upload the plan and the static results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-data-plan
          path: admission
          retention-days: 14

  # One core build per purpose, made with a neutral data-only theme, shared by every data-only theme of the call
  core-build:
    name: Shared core build (${{ matrix.purpose }})
    needs: plan
    if: needs.plan.outputs.shared-builds != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        purpose: ${{ fromJSON(needs.plan.outputs.shared-builds) }}
    steps:
      - name: Checkout the core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.core-repository }}
          ref: ${{ needs.plan.outputs.core-sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          NUXT_PUBLIC_THEME: ${{ fromJSON(needs.plan.outputs.plan).baseTheme }}
          MICELIO_THEME_DIRS: ${{ fromJSON(needs.plan.outputs.plan).baseThemeDir }}
          # /_theme is registered at build time only with this flag (modules/theme/specimen/setup.ts)
          MICELIO_SPECIMEN: ${{ matrix.purpose == 'quality' && '1' || '' }}
        run: npm run build
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-core-build-${{ matrix.purpose }}
          path: .output
          include-hidden-files: true
          retention-days: 1

  performance:
    name: Performance (${{ matrix.theme }}, ${{ matrix.mode }}, ${{ matrix.font }} font)
    needs: [plan, core-build]
    if: always() && needs.plan.result == 'success' && needs.core-build.result != 'failure' && needs.core-build.result != 'cancelled' && fromJSON(needs.plan.outputs.plan).performance[0] != null
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.plan.outputs.image }}
      options: --ipc=host
    timeout-minutes: 30
    # The image's default shell is sh; bash as on a runner, for the arrays and `pipefail`
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).performance }}
    env:
      MICELIO_THEME_DIRS: ${{ needs.plan.outputs.theme-dirs }}
      NUXT_PUBLIC_THEME: ${{ matrix.theme }}
      # Site mode of ADR 0006, read at build time
      NUXT_PUBLIC_SITE_MODE: ${{ matrix.mode }}
      # Chromium only, but the same HOME as every job in the image
      HOME: /root
      THEME: ${{ matrix.theme }}
      MODE: ${{ matrix.mode }}
      FONT: ${{ matrix.font }}
    steps:
      - name: Checkout the core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.core-repository }}
          ref: ${{ needs.plan.outputs.core-sha }}
          persist-credentials: false
      - name: Checkout the themes
        if: needs.plan.outputs.external == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: theme-source
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download the shared core build
        if: matrix.mode == 'dynamic' && matrix.build == 'shared'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-core-build-performance
          path: .output
      # No nuxt build: the theme goes into the store of the build that exists (ADR 0009, section 1)
      - name: Install the theme into the shared build
        if: matrix.mode == 'dynamic' && matrix.build == 'shared'
        run: npm run --silent theme:admit -- install --theme "${THEME}" --output .output --purpose performance --out "admission/${THEME}/build-performance-${MODE}-${FONT}.json"
      - name: Build with the theme
        if: matrix.mode == 'dynamic' && matrix.build == 'own'
        env:
          REASON: ${{ matrix.reason }}
        run: |
          npm run build
          npm run --silent theme:admit -- build-info --output .output --purpose performance --reason "${REASON}" --out "admission/${THEME}/build-performance-${MODE}-${FONT}.json"
      # A static or landing entry generates its own site inside the perf script, against the mock Strapi
      - name: Check performance budgets
        continue-on-error: ${{ !inputs.fail-on-errors }}
        run: |
          extra=()
          if [ "${FONT}" = heaviest ]; then extra=(--display-font heaviest); fi
          npm run perf -- --check --theme "${THEME}" --mode "${MODE}" "${extra[@]}" --out "admission/${THEME}/perf-${MODE}-${FONT}.json"
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-data-perf-${{ matrix.theme }}-${{ matrix.mode }}-${{ matrix.font }}
          path: admission
          if-no-files-found: ignore
          retention-days: 14

  # Visual regression and axe in every mode and viewport (projects of playwright.theme.config.ts), in the Playwright image the baselines come from.
  # With update-snapshots it only renders the baselines
  quality:
    name: ${{ inputs.update-snapshots && 'Snapshots' || 'Quality' }} (${{ matrix.theme }})
    needs: [plan, core-build]
    if: always() && needs.plan.result == 'success' && needs.core-build.result != 'failure' && needs.core-build.result != 'cancelled' && fromJSON(needs.plan.outputs.plan).quality[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ${{ needs.plan.outputs.image }}
      options: --ipc=host
    # The image's default shell is sh; bash as on a runner, for the arrays and `pipefail`
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).quality }}
    env:
      MICELIO_THEME_DIRS: ${{ needs.plan.outputs.theme-dirs }}
      NUXT_PUBLIC_THEME: ${{ matrix.theme }}
      MICELIO_SPECIMEN: 1
      E2E_BUILD: 1
      HOME: /root
      THEME: ${{ matrix.theme }}
      THEME_SNAPSHOT_DIR: ${{ matrix.snapshots }}
      THEME_SKIP_VISUAL: ${{ !inputs.visual && !inputs.update-snapshots && '1' || '' }}
      THEME_REPORT_JSON: admission/${{ matrix.theme }}/quality.json
    steps:
      - name: Checkout the core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.core-repository }}
          ref: ${{ needs.plan.outputs.core-sha }}
          persist-credentials: false
      - name: Checkout the themes
        if: needs.plan.outputs.external == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: theme-source
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download the shared core build
        if: matrix.build == 'shared'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-core-build-quality
          path: .output
      - name: Install the theme into the shared build
        if: matrix.build == 'shared'
        run: npm run --silent theme:admit -- install --theme "${THEME}" --output .output --purpose quality --out "admission/${THEME}/build-quality.json"
      - name: Build with the theme
        if: matrix.build == 'own'
        env:
          REASON: ${{ matrix.reason }}
        run: |
          npm run build
          npm run --silent theme:admit -- build-info --output .output --purpose quality --reason "${REASON}" --out "admission/${THEME}/build-quality.json"
      - name: Run visual regression and axe
        id: test
        if: ${{ !inputs.update-snapshots }}
        continue-on-error: ${{ !inputs.fail-on-errors }}
        run: npm run test:theme
      - name: Upload the result
        if: ${{ always() && !inputs.update-snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-data-quality-${{ matrix.theme }}
          path: admission
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload report and diffs
        if: failure() || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-report-${{ matrix.theme }}
          path: |
            playwright-report-theme/
            test-results-theme/
          retention-days: 7
      # Never committed by CI: a human reviews the images and commits them (docs/theme-testing.md). After a failed run they are the
      # baselines as they render now; with update-snapshots, the reason for the run
      - name: Render the baselines
        id: render
        if: ${{ !cancelled() && (inputs.update-snapshots || (inputs.visual && steps.test.outcome == 'failure')) }}
        run: npm run test:theme:update -- e2e/theme/visual.spec.ts
      - name: Upload the baselines
        if: ${{ !cancelled() && steps.render.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-snapshots-${{ matrix.theme }}
          path: ${{ matrix.snapshots }}/
          retention-days: 14

  report:
    name: Admission report
    needs: [plan, performance, quality]
    if: always() && needs.plan.result == 'success' && !inputs.update-snapshots
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.report.outputs.ok }}
      static: ${{ steps.report.outputs.static }}
      performance: ${{ steps.report.outputs.performance }}
      quality: ${{ steps.report.outputs.quality }}
      artifact: ${{ inputs.artifact-prefix }}-reports
    steps:
      - name: Checkout the core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.core-repository }}
          ref: ${{ needs.plan.outputs.core-sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-data-*
          path: collected
          merge-multiple: true
      - name: Write the reports
        id: report
        env:
          CORE_REPOSITORY: ${{ inputs.core-repository }}
          CORE_REF: ${{ needs.plan.outputs.core-ref }}
          CORE_SHA: ${{ needs.plan.outputs.core-sha }}
          VISUAL: ${{ inputs.visual }}
        run: |
          ok=true
          for id in $(jq -r '.themes[].id' collected/plan.json); do
            mkdir -p "reports/${id}"
            npm run --silent theme:admit -- report --theme "${id}" --dir "collected/${id}" --plan collected/plan.json --visual "${VISUAL}" \
              --core-repository "${CORE_REPOSITORY}" --core-ref "${CORE_REF}" --core-sha "${CORE_SHA}" --out "reports/${id}/admission-report.json"
            jq -e .ok "reports/${id}/admission-report.json" > /dev/null || ok=false
            cp collected/"${id}"/*.tgz "reports/${id}/" 2>/dev/null || true
          done
          # One result per check across every theme, for a caller that gates them separately (deploy.yml)
          status() { jq -rs "$1" reports/*/admission-report.json; }
          {
            echo "ok=${ok}"
            echo "static=$(status 'if all(.[]; .checks.static.status == "passed") then "passed" else "failed" end')"
            echo "performance=$(status 'if all(.[]; all(.checks.performance[]; .status == "passed")) then "passed" else "failed" end')"
            echo "quality=$(status 'if all(.[]; .checks.quality.status == "skipped") then "skipped" elif all(.[]; .checks.quality.status == "passed") then "passed" else "failed" end')"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-reports
          path: reports
          retention-days: 30
      - name: Fail on errors
        if: inputs.fail-on-errors && steps.report.outputs.ok != 'true'
        run: |
          echo "::error::Theme admission failed: see the summary and the admission reports"
          exit 1
