name: Theme Index Prepare

# Makes the registry's next index (ADR 0008, decision 4; ADR 0009, section 3 and the amendment of 2026-10-28; #312), writes nothing to the registry and signs nothing.
# `add` reads the package, verifies its attestation against the publish signer and derives the entry from the package; `yank` marks a published version; `incompatible` marks a published version that fails from a core version on (#314). Either way
# the new index is checked against the one the registry holds, whose signature must verify (npm run theme:publish -- index). The job of bogd3v/micelio-themes'
# sign-index.yml signs the result, so the certificate names that file, and theme-push-bundle.yml writes it. Called from a bogd3v repository.
# The caller to copy: docs/themes/registry-workflows/sign-index.yml; how it fits: docs/themes/publishing-a-theme.md.
on:
  workflow_call:
    inputs:
      action:
        description: '`add` lists a version theme-publish.yml pushed; `yank` marks a published version yanked; `incompatible` marks it incompatible with a core version and later'
        type: string
        required: true
      theme:
        description: Id of the theme
        type: string
        required: true
      version:
        description: Exact version
        type: string
        required: true
      digest:
        description: For `add`, the sha256 digest of the package (the `digest` output of theme-publish.yml)
        type: string
        default: ''
      report-digest:
        description: For `add`, the sha256 digest of the admission report (the `report-digest` output of theme-publish.yml)
        type: string
        default: ''
      reason:
        description: For `yank` and `incompatible`, why, in one line of at most 500 characters; it is written in the index
        type: string
        default: ''
      core:
        description: For `incompatible`, the first core version (X.Y.Z, or X.Y.Z-rc.N) the version fails on
        type: string
        default: ''
      core-ref:
        description: A release tag (vX.Y.Z) or a full commit SHA of bogd3v/micelio whose scripts decide what is signed; pin the same ref as the `uses:` line
        type: string
        required: true
      registry:
        description: The registry whose index is written
        type: string
        default: ghcr.io/bogd3v/micelio-themes
    outputs:
      digest:
        description: The sha256 digest of the index to sign
        value: ${{ jobs.prepare.outputs.digest }}
      index-artifact:
        description: The artifact that holds index/index.json, the document to sign, and index/index.json.info
        value: ${{ jobs.prepare.outputs.index-artifact }}

permissions:
  contents: read

jobs:
  prepare:
    name: Index (${{ inputs.action }} ${{ inputs.theme }}@${{ inputs.version }})
    if: github.repository_owner == 'bogd3v'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      index-artifact: ${{ steps.index.outputs.artifact }}
    env:
      REGISTRY: ${{ inputs.registry }}
      ACTION: ${{ inputs.action }}
      THEME: ${{ inputs.theme }}
      VERSION: ${{ inputs.version }}
      INDEX_CORE: ${{ inputs.core }}
    steps:
      - name: Check the inputs
        env:
          CORE_REF: ${{ inputs.core-ref }}
          DIGEST: ${{ inputs.digest }}
          REPORT_DIGEST: ${{ inputs.report-digest }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "${CORE_REF}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?|[0-9a-f]{40})$ ]] || fail "core-ref must be a release tag (vX.Y.Z) or a full commit SHA"
          [[ "${ACTION}" == add || "${ACTION}" == yank || "${ACTION}" == incompatible ]] || fail "action is add, yank or incompatible"
          [[ "${THEME}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && ${#THEME} -le 64 ]] || fail "theme is not a theme id"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.0-9A-Za-z]*)$ && ${#VERSION} -le 128 ]] || fail "version is not a semver version"
          if [ "${ACTION}" = incompatible ]; then
            [[ "${INDEX_CORE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || fail "incompatible needs core, a core version (X.Y.Z or X.Y.Z-rc.N)"
          fi
          if [ "${ACTION}" = add ]; then
            [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "add needs the sha256 digest of the package"
            [[ -z "${REPORT_DIGEST}" || "${REPORT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || fail "report-digest is not a sha256 digest"
          fi
      - name: Checkout the core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bogd3v/micelio
          ref: ${{ inputs.core-ref }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install script of any dependency runs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Reads the index the registry holds (its signature must verify), applies the change and checks the result against it
      - name: Make the new index
        id: index
        env:
          DIGEST: ${{ inputs.digest }}
          REPORT_DIGEST: ${{ inputs.report-digest }}
          YANK_REASON: ${{ inputs.reason }}
        run: |
          export MICELIO_THEME_REGISTRY="${REGISTRY}"
          args=(--action "${ACTION}" --theme "${THEME}" --version "${VERSION}" --out index/index.json)
          if [ "${ACTION}" = add ]; then
            args+=(--digest "${DIGEST}")
            if [ -n "${REPORT_DIGEST}" ]; then args+=(--report-digest "${REPORT_DIGEST}"); fi
          fi
          if [ "${ACTION}" = incompatible ]; then args+=(--core "${INDEX_CORE}"); fi
          npm run --silent theme:publish -- index "${args[@]}"
          {
            echo "digest=$(jq -r .digest index/index.json.info)"
            echo "artifact=theme-index-$(jq -r .digest index/index.json.info | cut -c8-23)"
          } >> "$GITHUB_OUTPUT"
      # What the approver of the environment `theme-index` is asked to sign
      - name: Summarize the change
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          {
            echo "### Index change: ${ACTION} \`${THEME}@${VERSION}\`"
            echo "- New index: \`$(jq -r .digest index/index.json.info)\`, made from \`$(jq -r '.base // "no index"' index/index.json.info)\`"
            if [ "${ACTION}" = add ]; then
              echo "- Package: \`${DIGEST}\`"
              jq -r --arg id "${THEME}" --arg v "${VERSION}" '.themes[$id].versions[$v] | "- Contract \(.contract), license \(.license), code: \(.code), tier \(.tier)"' index/index.json
            elif [ "${ACTION}" = incompatible ]; then
              jq -r --arg id "${THEME}" --arg v "${VERSION}" '.themes[$id].versions[$v].incompatible | "- Incompatible from core \(.core): \(.reason)"' index/index.json
            else
              jq -r --arg id "${THEME}" --arg v "${VERSION}" '.themes[$id].versions[$v].yank | "- Reason: \(.reason)"' index/index.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.index.outputs.artifact }}
          path: index
          retention-days: 7
