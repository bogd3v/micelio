name: Theme Admission Fixtures

# Proves the reusable admission (theme-admission.yml, #311) end to end: a data-only theme passes and a broken one fails with the messages
# of theme:check, npm run perf and axe, both on one shared core build, with the per-check outputs a caller gates on; and theme-snapshots.yml,
# called as a theme repository calls it, renders the baselines of the data-only theme. Runs when the admission or what it calls changes.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/theme-admission*.yml
      - .github/workflows/theme-snapshots.yml
      - scripts/theme-admit.ts
      - scripts/perf/**
      - modules/theme/**
      - e2e/theme/**
      - playwright.theme.config.ts
      - server/lib/builtInStore.ts
      - scripts/ci/playwright-image.sh
      - package.json
      - package-lock.json
      - test/fixtures/admission/**
      - test/fixtures/themes/data-only/**
      - test/fixtures/themes/minimal/**
      - test/fixtures/themes/alternates/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: Admission
    uses: ./.github/workflows/theme-admission.yml
    with:
      theme-dirs: |
        test/fixtures/themes/data-only
        test/fixtures/themes/alternates
        test/fixtures/admission/admission-broken
      core-repository: ${{ github.repository }}
      core-ref: ${{ github.sha }}
      modes: '["dynamic", "static"]'
      # Baselines of a fixture would be megabytes of PNGs; the core's own themes cover visual regression
      visual: false
      # data-only has a valid record (partial: nothing was verified by a person), admission-broken one the schema refuses
      accessibility-root: test/fixtures/admission/accessibility
      display-font: false
      fail-on-errors: false
      artifact-prefix: fixtures

  snapshots:
    name: Snapshots
    uses: ./.github/workflows/theme-snapshots.yml
    with:
      theme-dirs: test/fixtures/themes/data-only
      core-repository: ${{ github.repository }}
      core-ref: ${{ github.sha }}
      # Its own prefix: both calls upload a plan and a shared quality build
      artifact-prefix: fixture-baselines

  expect:
    name: Expected results
    needs: [admission, snapshots]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.admission.outputs.reports }}
          path: reports
      # A failed render must not hide the reports: the baselines are asserted last
      - name: Download the baselines
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixture-baselines-snapshots-data-only
          path: snapshots
      # The messages are the ones theme:check, npm run perf and a11y.spec.ts print today
      - name: Check the reports
        env:
          OK: ${{ needs.admission.outputs.ok }}
          STATIC: ${{ needs.admission.outputs.static }}
          PERFORMANCE: ${{ needs.admission.outputs.performance }}
          QUALITY: ${{ needs.admission.outputs.quality }}
          SNAPSHOTS: ${{ needs.snapshots.result }}
        run: |
          test "${OK}" = false
          # admission-broken fails each check, so each output is "failed"
          test "${STATIC}/${PERFORMANCE}/${QUALITY}" = failed/failed/failed
          pass=reports/data-only/admission-report.json
          broken=reports/admission-broken/admission-report.json
          jq -e '.ok == true and (.errors | length) == 0' "${pass}"
          jq -e '[.builds[] | select(.kind == "shared" and .baseTheme == "minimal")] | length == 2' "${pass}"
          jq -e '.package.digest | startswith("sha256:")' "${pass}"
          jq -e '[.checks.quality.specs[].passed] | add > 0' "${pass}"
          jq -e '[.checks.performance[].status] | length == 2 and all(. == "passed")' "${pass}"
          jq -e '.accessibility.status == "partial" and .accessibility.current and (.accessibility.record.lines | length) == 18' "${pass}"
          # alternates uses the other variant of every region on the shared build (the default variants): measure.mjs allows its variant chunks
          alternates=reports/alternates/admission-report.json
          jq -e '.ok == true and (.errors | length) == 0' "${alternates}"
          jq -e '[.builds[] | select(.kind == "shared" and .baseTheme == "minimal")] | length == 2' "${alternates}"
          jq -e '[.checks.performance[].status] | length == 2 and all(. == "passed")' "${alternates}"
          jq -e '.ok == false and .package == null' "${broken}"
          jq -e '[.builds[] | select(.kind == "shared")] | length == 2' "${broken}"
          # Each pattern is a regular expression over the error messages of one check
          expect() { jq -e --arg check "$1" --arg re "$2" '[.errors[] | select(.check == $check and (.message | test($re)))] | length > 0' "${broken}" > /dev/null || { echo "::error::No $1 error matching: $2"; exit 1; }; }
          expect static '^theme "admission-broken", mode "day": "ink-muted" on "surface" has 1\.90:1, needs 4\.5:1'
          expect performance '^ERROR \[theme admission-broken, dynamic mode\] home: cssKb [0-9.]+ exceeds the budget of [0-9.]+$'
          expect quality 'a11y\.spec\.ts › home has no axe violations: [\s\S]*color-contrast'
          expect accessibility '^test/fixtures/admission/accessibility/admission-broken\.json: lines\.keyboard\.focus-visible\.issue: '
          echo "data-only passed with its accessibility record, alternates on the shared build with its variant allowance; admission-broken failed with the contrast, budget, axe and record messages"
      # Every baseline visual.spec.ts takes of the data-only theme, as <mode>/<viewport>/<page>.png: 52 when this was written. A page or
      # viewport added to the spec changes the number on purpose
      - name: Check the baselines
        env:
          SNAPSHOTS: ${{ needs.snapshots.result }}
        run: |
          test "${SNAPSHOTS}" = success
          find snapshots -name '*.png' | sort
          test "$(find snapshots -name '*.png' | wc -l)" -eq 52
          echo "theme-snapshots.yml rendered the baselines of data-only"
