# Copy to bogd3v/micelio-themes/.github/workflows/publish.yml (ADR 0009, amendment of 2026-10-28; #312).
# The job `attest` is defined in THIS file, so the certificate of the package's attestation names
#   https://github.com/bogd3v/micelio-themes/.github/workflows/publish.yml@refs/heads/main
# which is DEFAULT_SIGNER.packages in modules/theme/registry/constants.ts. Do not move that job into another file or rename this one:
# every client would refuse the versions. Everything else is a reusable workflow of the core, pinned to one release (replace v0.5.5 and
# core-ref together). Run it from the default branch only (`main`): the ref is part of the identity.
name: Publish

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Id of the theme to publish (a folder of this repository)
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Baselines are read from __screenshots__/<id>/ and the accessibility record from accessibility/<id>.json of this repository (publishing-a-theme.md)
  admission:
    uses: bogd3v/micelio/.github/workflows/theme-admission.yml@v0.5.5
    with:
      theme-dirs: ${{ inputs.theme }}
      themes: '["${{ inputs.theme }}"]'
      core-ref: v0.5.5
    permissions:
      contents: read

  publish:
    needs: admission
    uses: bogd3v/micelio/.github/workflows/theme-publish.yml@v0.5.5
    with:
      theme: ${{ inputs.theme }}
      reports: ${{ needs.admission.outputs.reports }}
      admitted: ${{ needs.admission.outputs.ok }}
      core-ref: v0.5.5
    permissions:
      contents: read
      packages: write

  # The only job that signs a package. It runs no code of the theme or the core: it attests the bytes the job above pushed
  attest:
    needs: publish
    if: github.repository == 'bogd3v/micelio-themes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.publish.outputs.package-artifact }}
          path: package
      - name: Attest the package
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: package/package.tgz
      - name: Keep the bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: mkdir -p bundle && cp "${BUNDLE}" bundle/bundle.json
      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-bundle-${{ inputs.theme }}-${{ needs.publish.outputs.version }}
          path: bundle/bundle.json
          retention-days: 7

  bundle:
    needs: [publish, attest]
    uses: bogd3v/micelio/.github/workflows/theme-push-bundle.yml@v0.5.5
    with:
      kind: package
      theme: ${{ inputs.theme }}
      version: ${{ needs.publish.outputs.version }}
      digest: ${{ needs.publish.outputs.digest }}
      bundle-artifact: theme-bundle-${{ inputs.theme }}-${{ needs.publish.outputs.version }}
      core-ref: v0.5.5
    permissions:
      contents: read
      packages: write

  # Lists the version: sign-index.yml of this repository (below), whose own job signs the index
  index:
    needs: [publish, bundle]
    uses: ./.github/workflows/sign-index.yml
    with:
      action: add
      theme: ${{ inputs.theme }}
      version: ${{ needs.publish.outputs.version }}
      digest: ${{ needs.publish.outputs.digest }}
      report-digest: ${{ needs.publish.outputs.report-digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # GitHub keeps one pending run per concurrency group and cancels an older pending one for a newer one, so with `theme-index` waiting for an approval a request
  # to the index can be lost after the package was pushed and attested. This job runs even then, and fails with the exact re-run (publishing-a-theme.md)
  listed:
    needs: [publish, index]
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: bogd3v/micelio/.github/workflows/theme-index-listed.yml@v0.5.5
    with:
      theme: ${{ inputs.theme }}
      version: ${{ needs.publish.outputs.version }}
      digest: ${{ needs.publish.outputs.digest }}
      report-digest: ${{ needs.publish.outputs.report-digest }}
      core-ref: v0.5.5
    permissions:
      contents: read
      packages: read
